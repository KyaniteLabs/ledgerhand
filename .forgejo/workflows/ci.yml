name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SBF_OUT_DIR: ${{ github.workspace }}/tests/fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (issue -> verify -> tamper, SBF)
        run: cargo test --manifest-path tests/Cargo.toml
  anchor-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Anchor program compiles
        run: cargo check -p trust_layer
